services:
  # Disable the default single API service for this stack.
  api:
    profiles:
      - single-api
    ports: []

  api-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zwanga-api-1
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5200
      DATABASE_HOST: ${DOCKER_DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DOCKER_DATABASE_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - zwanga-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5200/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: zwanga-api-2
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5200
      DATABASE_HOST: ${DOCKER_DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DOCKER_DATABASE_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - zwanga-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5200/api/v1/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: zwanga-nginx-lb
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-18080}:80"
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - zwanga-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  zwanga-network:
    driver: bridge
