name: Deploy NestJS to AWS ECS Fargate

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-ecs-fargate-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  ECS_APP_CONTAINER: api
  DEPLOY_BRANCH: release

jobs:
  test-build-deploy:
    name: Test, prepare, replace and activate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate infrastructure documentation
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash infra-aws/scripts/check-infra-documentation.sh "${BASE_SHA}" "${HEAD_SHA}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run tests
        run: npm run test -- --runInBand
      - name: Compile NestJS
        run: npm run build
      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/${DEPLOY_BRANCH}" ]] || { echo "Deploy from ${DEPLOY_BRANCH} only."; exit 1; }
          : "${AWS_REGION:?Configure AWS_REGION}"
          : "${AWS_ROLE_ARN:?Configure AWS_ROLE_ARN}"
          : "${ECR_REPOSITORY:?Configure ECR_REPOSITORY}"
          : "${ECS_CLUSTER:?Configure ECS_CLUSTER}"
          : "${ECS_SERVICE:?Configure ECS_SERVICE}"
      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: '046374119247'
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push immutable commit tag
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/arm64
          # Never overwrite :latest while old task definitions can reference it.
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Prepare schema, deploy compatible servers, then activate finance
        env:
          DEPLOY_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.docker-build.outputs.digest }}
        run: node infra-aws/scripts/deploy-resilient.cjs
