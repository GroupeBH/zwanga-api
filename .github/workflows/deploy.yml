name: Deploy NestJS to AWS ECS Fargate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-ecs-fargate-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

jobs:
  test-build-deploy:
    name: Test, publish and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm run test -- --runInBand

      - name: Compile NestJS
        run: npm run build

      - name: Validate deployment variables
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Configure the AWS_REGION repository variable}"
          : "${AWS_ROLE_ARN:?Configure the AWS_ROLE_ARN repository variable}"
          : "${ECR_REPOSITORY:?Configure the ECR_REPOSITORY repository variable}"
          : "${ECS_CLUSTER:?Configure the ECS_CLUSTER repository variable}"
          : "${ECS_SERVICE:?Configure the ECS_SERVICE repository variable}"

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable and deployment tags
        id: docker-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Force ECS deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          deployment_id="$(aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --query 'service.deployments[?status==`PRIMARY`].id | [0]' \
            --output text)"

          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for ECS stability
        shell: bash
        run: |
          set -euo pipefail

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].{status:status,running:runningCount,desired:desiredCount,deployments:deployments[*].{id:id,status:status,rolloutState:rolloutState}}'

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### AWS ECS Fargate deployment"
            echo "- Image digest: \`${{ steps.docker-build.outputs.digest }}\`"
            echo "- Commit tag: \`${GITHUB_SHA}\`"
            echo "- ECS cluster: \`${ECS_CLUSTER}\`"
            echo "- ECS service: \`${ECS_SERVICE}\`"
            echo "- Deployment: \`${{ steps.deploy.outputs.deployment_id }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
