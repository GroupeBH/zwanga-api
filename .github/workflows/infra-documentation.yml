name: Validate AWS infrastructure documentation

on:
  pull_request:
    paths:
      - "infra-aws/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra-documentation.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.nginx.yml"
      - ".env.docker.example"
  push:
    branches:
      - release
    paths:
      - "infra-aws/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/infra-documentation.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.nginx.yml"
      - ".env.docker.example"

permissions:
  contents: read

jobs:
  documentation:
    name: Require detailed infrastructure documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate infrastructure changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash infra-aws/scripts/check-infra-documentation.sh "${BASE_SHA}" "${HEAD_SHA}"
