version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: zwanga-postgres
    environment:
      POSTGRES_USER: zwanga_user
      POSTGRES_PASSWORD: zwanga_password
      POSTGRES_DB: zwanga_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zwanga-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zwanga_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zwanga-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zwanga-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zwanga-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=zwanga_user
      - DATABASE_PASSWORD=zwanga_password
      - DATABASE_NAME=zwanga_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zwanga-network
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  redis_data:

networks:
  zwanga-network:
    driver: bridge

