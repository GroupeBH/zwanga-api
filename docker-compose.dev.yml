version: '3.8'

# Configuration pour le développement avec hot-reload
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      target: builder
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - /app/node_modules
    command: npm run start:dev
    environment:
      - NODE_ENV=development

